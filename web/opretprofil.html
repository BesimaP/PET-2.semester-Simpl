<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simpl — Opret profil</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="card">
    <h1>Simpl</h1>
    <p class="subtitle">Opret din profil</p>

    <form>
        <label for="name">Navn</label>
        <input type="text" id="name" name="name" placeholder="Dit fulde navn" required>

        <label for="dateOfBirth">Fødselsdato</label>
        <input type="date" id="dateOfBirth" name="dateOfBirth" required>

        <label for="username">Brugernavn</label>
        <input type="text" id="username" name="username" placeholder="Vælg et brugernavn" required>

        <label for="password">Adgangskode</label>
        <input type="password" id="password" name="password" placeholder="Vælg en adgangskode" required>

        <button type="submit">Opret profil</button>
    </form>

    <p class="link-line">Har du allerede en profil? <a href="login.html">Log ind</a></p>
</main>

</body>
</html>
