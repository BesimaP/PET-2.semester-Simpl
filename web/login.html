<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simpl – Log ind</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/tokens.css">
</head>
<body>

<main class="card">
  <h1>Simpl</h1>
  <p class="subtitle">Log ind på din profil</p>

  <form>
    <label for="username">Brugernavn</label>
    <input type="text" id="username" name="username" placeholder="Dit brugernavn" required>

    <label for="password">Adgangskode</label>
    <input type="password" id="password" name="password" placeholder="Din adgangskode" required>

    <button type="submit">Log ind</button>
  </form>

  <p class="link-line">Har du ikke en profil? <a href="opretprofil.html">Opret profil</a></p>
</main>

</body>
</html>
