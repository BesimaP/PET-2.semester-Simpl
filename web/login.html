<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simpl – Log ind</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/customStyle.css">

    <style>
        * {
            box-sizing: border-box;
        }

    </style>
</head>
<body>

<div class="split left">
    <div class="centered">
        <img src="Skærmbillede%202026-09-07%20kl.%2009.56.14.png"/>
        <h2>SIMPL</h2>
        <p>Dit forløb, din vej</p>
        <p>Dine data er krypterede og private</p>
    </div>
</div>

<div class="split right">
    <div class="a">
        <div class="centered">
            <h2>Velkommen</h2>
            <h3>Login på din profil</h3>
            <form action="modtagersider/modtager.html">
                <label for="username">Brugernavn:</label><br>
                <input type="text" id="username" name="username" placeholder="Dit brugernavn">

                <label for="password">Adgangskode:</label><br>
                <input type="password" id="password" name="password" placeholder="Din adgangskode">

                <button type="submit">Login</button>
            </form>
            <p>Har du ikke en profil? <a href="opretprofil.html">Opret profil</a></p>
        </div>
    </div>
</div>

</body>
</html>
